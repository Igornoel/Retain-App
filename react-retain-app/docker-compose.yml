services:
  postgres:
    image: postgres:17-alpine
    container_name: retain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retain
      POSTGRES_USER: retain
      POSTGRES_PASSWORD: retain
    ports:
      - "5433:5432"
    volumes:
      - retain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retain -d retain"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  retain_postgres_data:
